<svg width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#e8f5e8"/>
  <rect x="50" y="50" width="700" height="100" fill="#6f42c1" rx="10"/>
  <text x="400" y="110" text-anchor="middle" fill="white" font-size="24" font-family="Arial">第1章 - 第3页</text>
  
  <rect x="50" y="200" width="300" height="400" fill="#f8d7da" rx="5" stroke="#721c24" stroke-width="2"/>
  <text x="200" y="230" text-anchor="middle" fill="#721c24" font-size="14" font-family="Arial">左侧面板</text>
  <circle cx="200" cy="300" r="40" fill="#fd7e14"/>
  <text x="200" y="310" text-anchor="middle" fill="white" font-size="16" font-family="Arial">A</text>
  
  <rect x="450" y="200" width="300" height="400" fill="#d4edda" rx="5" stroke="#155724" stroke-width="2"/>
  <text x="600" y="230" text-anchor="middle" fill="#155724" font-size="14" font-family="Arial">右侧面板</text>
  <rect x="500" y="280" width="200" height="100" fill="#20c997" rx="5"/>
  <text x="600" y="340" text-anchor="middle" fill="white" font-size="14" font-family="Arial">重要信息</text>
  
  <line x1="350" y1="250" x2="450" y2="350" stroke="#6c757d" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
  
  <rect x="150" y="700" width="500" height="100" fill="#fff3cd" rx="5" stroke="#856404" stroke-width="1"/>
  <text x="400" y="730" text-anchor="middle" fill="#856404" font-size="14" font-family="Arial">情节发展到关键时刻</text>
  <text x="400" y="760" text-anchor="middle" fill="#856404" font-size="14" font-family="Arial">两个角色开始对话</text>
  
  <text x="400" y="1150" text-anchor="middle" fill="#6c757d" font-size="12" font-family="Arial">第3页 / 共5页</text>
</svg>